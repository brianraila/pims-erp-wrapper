spring:
  cloud:
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/pims_onboarding_test
    username: test
    password: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcRepositoriesAutoConfiguration

erpnext:
  registry:
    fallback-enabled: true
  sites:
    test-tenant:
      url: http://localhost:8000
      api-key: test-key
      api-secret: test-secret

ms:
  aes:
    algorithm: AES/GCM/NoPadding
    current-key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
