spring:
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
      config:
        enabled: false

server:
  port: 8083

erpnext:
  scheme: http
  domain: local
  api-key: ${ERPNEXT_API_KEY:}
  api-secret: ${ERPNEXT_API_SECRET:}
  tenants:
    pharmacy-a:
      api-key: ${ERPNEXT_PHARMACY_A_API_KEY:}
      api-secret: ${ERPNEXT_PHARMACY_A_API_SECRET:}
    pharmacy-b:
      api-key: ${ERPNEXT_PHARMACY_B_API_KEY:}
      api-secret: ${ERPNEXT_PHARMACY_B_API_SECRET:}
