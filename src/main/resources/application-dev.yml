spring:
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
      config:
        enabled: false

server:
  port: 8083

erpnext:
  scheme: http
  domain: local
  # port omitted — ERPNext frontend is on default HTTP port 80
  # Global fallback credentials (unused when per-tenant entries are set)
